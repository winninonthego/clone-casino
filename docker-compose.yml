version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: casino_db
    environment:
      POSTGRES_DB: casino_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - casino_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casino_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: casino_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres
    networks:
      - casino_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casino_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - casino_network

volumes:
  postgres_data:

networks:
  casino_network:
    driver: bridge
